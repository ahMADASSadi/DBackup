services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root-test-password
      MYSQL_DATABASE: testdb
      MYSQL_USER: test
      MYSQL_PASSWORD: test-pass-12
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utest", "-ptest-pass-12"]
      interval: 3s
      timeout: 5s
      retries: 40

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  tester:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile.test
    working_dir: /src
    volumes:
      - ../apps/backend:/src
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: testdb
      MYHOST: mysql
      MYPORT: "3306"
      MYUSER: test
      MYPASSWORD: test-pass-12
      MYDATABASE: testdb
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: backups
      S3_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: ["go", "test", "-tags", "integration", "-count=1", "./internal/backup/", "./internal/storage/"]
